name: Chrome Hearts Monitor

on:

  schedule:

    - cron: "0 * * * *"

  workflow_dispatch:

permissions:

  contents: write

concurrency:

  group: chrome-hearts-monitor

  cancel-in-progress: false

jobs:

  check:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Get the files

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Install dependencies

        run: pip install requests truststore

      - name: Run the monitor

        env:

          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: python chrome_hearts_monitor.py

      - name: Save what it learned

        if: always()

        run: |

          git config user.name "ch-monitor"

          git config user.email "ch-monitor@users.noreply.github.com"

          git add chrome_hearts.db

          git diff --staged --quiet && echo "nothing changed" && exit 0

          git commit -m "state update"

          git pull --rebase --autostash || true

          git push
 
